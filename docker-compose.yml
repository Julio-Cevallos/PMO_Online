services:
  db:
    image: postgres:16
    container_name: pmo_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pmo}
      POSTGRES_USER: ${POSTGRES_USER:-pmo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pmo_dev}
    ports:
      - "5432:5432"
    volumes:
      - pmo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pmo} -d ${POSTGRES_DB:-pmo}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pmo_pgdata:
