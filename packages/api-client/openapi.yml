openapi: 3.0.3
info:
  title: PMO Online API
  version: 0.1.0
  description: API de gestión de proyectos
paths:
  /api/audit/:
    get:
      operationId: audit_list
      description: |-
        Historial de auditoría: solo lectura, del más reciente al más antiguo, paginado.

        Cada persona ve solo lo que le corresponde (ver `audit/visibilidad.py`). Un evento fuera de
        su alcance responde 404.
      parameters:
      - in: query
        name: accion
        schema:
          type: string
      - in: query
        name: categoria
        schema:
          type: string
          enum:
          - contenido
          - entidad
          - sistema
        description: |-
          * `sistema` - Sistema
          * `entidad` - Entidad
          * `contenido` - Contenido
      - in: query
        name: desde
        schema:
          type: string
          format: date
      - in: query
        name: entidad
        schema:
          type: integer
      - in: query
        name: hasta
        schema:
          type: string
          format: date
      - in: query
        name: objeto_id
        schema:
          type: string
      - in: query
        name: objeto_tipo
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - in: query
        name: portafolio
        schema:
          type: integer
      - in: query
        name: usuario
        schema:
          type: integer
      tags:
      - audit
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEventoAuditoriaList'
          description: ''
  /api/audit/{id}/:
    get:
      operationId: audit_retrieve
      description: |-
        Historial de auditoría: solo lectura, del más reciente al más antiguo, paginado.

        Cada persona ve solo lo que le corresponde (ver `audit/visibilidad.py`). Un evento fuera de
        su alcance responde 404.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este evento de auditoría.
        required: true
      tags:
      - audit
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventoAuditoria'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: |-
        Cierra sesión: el refresh token queda en lista negra.

        Es público porque la validez la da el propio refresh token; así se puede
        cerrar sesión aunque el access token ya haya expirado.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Perfil del usuario autenticado (GET, PUT, PATCH), con su rol global
        y permisos.
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    put:
      operationId: auth_me_update
      description: Perfil del usuario autenticado (GET, PUT, PATCH), con su rol global
        y permisos.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MeRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    patch:
      operationId: auth_me_partial_update
      description: Perfil del usuario autenticado (GET, PUT, PATCH), con su rol global
        y permisos.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/auth/password/change/:
    post:
      operationId: auth_password_change_create
      description: Cambia la contraseña del usuario autenticado.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: Registro público de usuarios.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/auth/token/:
    post:
      operationId: auth_token_create
      description: Inicio de sesión (access + refresh). 401 credenciales inválidas,
        423 cuenta bloqueada.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
        '401':
          description: Credenciales inválidas
        '423':
          description: Cuenta bloqueada por intentos fallidos
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/entities/:
    get:
      operationId: entities_list
      description: |-
        Entidades. Cada persona ve solo las suyas; el Admin y el superusuario ven todas.

        - Cada entidad pertenece a un portafolio (D-29). Se ven las propias (membresía) y las de los
          portafolios donde se tiene permiso de verlas; el Admin ve todas.
        - Crear: Admin, Moderador (en su portafolio personal si no elige otro) o quien tenga
          `create_portfolio_entities` en el portafolio elegido.
        - Editar nombre y descripción: quien tenga `edit_portfolio_entities` en el portafolio o
          `entities.edit_entity` en ella.
        - Archivar o reactivar (`estado`) y mover (`/move/`): según permisos del portafolio. No hay DELETE.
      parameters:
      - in: query
        name: estado
        schema:
          type: string
          enum:
          - activa
          - archivada
        description: |-
          * `activa` - Activa
          * `archivada` - Archivada
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - in: query
        name: portafolio
        schema:
          type: integer
      - in: query
        name: tipo
        schema:
          type: integer
      tags:
      - entities
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEntidadList'
          description: ''
    post:
      operationId: entities_create
      description: |-
        Entidades. Cada persona ve solo las suyas; el Admin y el superusuario ven todas.

        - Cada entidad pertenece a un portafolio (D-29). Se ven las propias (membresía) y las de los
          portafolios donde se tiene permiso de verlas; el Admin ve todas.
        - Crear: Admin, Moderador (en su portafolio personal si no elige otro) o quien tenga
          `create_portfolio_entities` en el portafolio elegido.
        - Editar nombre y descripción: quien tenga `edit_portfolio_entities` en el portafolio o
          `entities.edit_entity` en ella.
        - Archivar o reactivar (`estado`) y mover (`/move/`): según permisos del portafolio. No hay DELETE.
      tags:
      - entities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntidadRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entidad'
          description: ''
  /api/entities/{entidad_id}/assignable-roles/:
    get:
      operationId: entities_assignable_roles_list
      description: |-
        Roles que quien consulta puede asignar en la entidad (D-18), del de más nivel al de menos.

        Sirve para llenar el selector de rol al agregar o cambiar miembros: quien no es Admin no
        puede listar todos los roles (`/api/roles/`).
      parameters:
      - in: path
        name: entidad_id
        schema:
          type: integer
        required: true
      tags:
      - entities
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RolAsignable'
          description: ''
  /api/entities/{entidad_id}/candidates/:
    get:
      operationId: entities_candidates_list
      description: |-
        Busca cuentas para sumar a la entidad (`?q=` por usuario, nombre o apellido).

        Devuelve como máximo 10, ordenadas por usuario. El Admin busca entre todas las cuentas
        (menos superusuarios); los demás, solo entre quienes comparten con ellos otra entidad.
      parameters:
      - in: path
        name: entidad_id
        schema:
          type: integer
        required: true
      - in: query
        name: q
        schema:
          type: string
        description: Texto a buscar (usuario o nombre)
      tags:
      - entities
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Candidato'
          description: ''
  /api/entities/{entidad_id}/invitations/:
    get:
      operationId: entities_invitations_list
      description: |-
        Invitaciones de una entidad.

        - GET: quien puede ver miembros. Por defecto las pendientes (`?estado=` otro estado o `todas`).
        - POST: invita a una cuenta que ya existe, con un rol de nivel menor al propio (D-18).
          La persona la acepta o rechaza desde `/api/invitations/`.
      parameters:
      - in: path
        name: entidad_id
        schema:
          type: integer
        required: true
      - in: query
        name: estado
        schema:
          type: string
        description: pendiente (defecto), aceptada, rechazada, cancelada o todas
      tags:
      - entities
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitacion'
          description: ''
    post:
      operationId: entities_invitations_create
      description: |-
        Invitaciones de una entidad.

        - GET: quien puede ver miembros. Por defecto las pendientes (`?estado=` otro estado o `todas`).
        - POST: invita a una cuenta que ya existe, con un rol de nivel menor al propio (D-18).
          La persona la acepta o rechaza desde `/api/invitations/`.
      parameters:
      - in: path
        name: entidad_id
        schema:
          type: integer
        required: true
      tags:
      - entities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitacionCrearRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitacion'
          description: ''
  /api/entities/{entidad_id}/invitations/{id}/:
    delete:
      operationId: entities_invitations_destroy
      description: 'Cancela una invitación pendiente (`DELETE`): la invitación se
        conserva como cancelada.'
      parameters:
      - in: path
        name: entidad_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - entities
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/entities/{entidad_id}/members/:
    get:
      operationId: entities_members_list
      description: |-
        Miembros de una entidad.

        - GET: Admin o quien tenga `entities.view_members`. Por defecto solo los activos
          (`?activa=false` los inactivos, `?activa=todas` todos).
        - POST: crea la cuenta de una persona nueva y la suma con un rol de nivel menor al propio
          (D-18). Para una cuenta que ya existe se usa una invitación (`/invitations/`, D-27).
      parameters:
      - in: query
        name: activa
        schema:
          type: string
        description: true (defecto), false o todas
      - in: path
        name: entidad_id
        schema:
          type: integer
        required: true
      tags:
      - entities
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Miembro'
          description: ''
    post:
      operationId: entities_members_create
      description: |-
        Miembros de una entidad.

        - GET: Admin o quien tenga `entities.view_members`. Por defecto solo los activos
          (`?activa=false` los inactivos, `?activa=todas` todos).
        - POST: crea la cuenta de una persona nueva y la suma con un rol de nivel menor al propio
          (D-18). Para una cuenta que ya existe se usa una invitación (`/invitations/`, D-27).
      parameters:
      - in: path
        name: entidad_id
        schema:
          type: integer
        required: true
      tags:
      - entities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MiembroCrearRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Miembro'
          description: ''
  /api/entities/{entidad_id}/members/{id}/:
    get:
      operationId: entities_members_retrieve
      description: |-
        Un miembro: ver, cambiar su rol o activarlo y desactivarlo (DELETE desactiva).

        Hace falta un nivel mayor al del rol actual del miembro y, si se cambia el rol, al del nuevo.
        Nadie modifica su propia membresía (salvo el Admin).
      parameters:
      - in: path
        name: entidad_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - entities
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Miembro'
          description: ''
    patch:
      operationId: entities_members_partial_update
      description: |-
        Un miembro: ver, cambiar su rol o activarlo y desactivarlo (DELETE desactiva).

        Hace falta un nivel mayor al del rol actual del miembro y, si se cambia el rol, al del nuevo.
        Nadie modifica su propia membresía (salvo el Admin).
      parameters:
      - in: path
        name: entidad_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - entities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMiembroEditarRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Miembro'
          description: ''
    delete:
      operationId: entities_members_destroy
      description: |-
        Un miembro: ver, cambiar su rol o activarlo y desactivarlo (DELETE desactiva).

        Hace falta un nivel mayor al del rol actual del miembro y, si se cambia el rol, al del nuevo.
        Nadie modifica su propia membresía (salvo el Admin).
      parameters:
      - in: path
        name: entidad_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - entities
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/entities/{id}/:
    get:
      operationId: entities_retrieve
      description: |-
        Entidades. Cada persona ve solo las suyas; el Admin y el superusuario ven todas.

        - Cada entidad pertenece a un portafolio (D-29). Se ven las propias (membresía) y las de los
          portafolios donde se tiene permiso de verlas; el Admin ve todas.
        - Crear: Admin, Moderador (en su portafolio personal si no elige otro) o quien tenga
          `create_portfolio_entities` en el portafolio elegido.
        - Editar nombre y descripción: quien tenga `edit_portfolio_entities` en el portafolio o
          `entities.edit_entity` en ella.
        - Archivar o reactivar (`estado`) y mover (`/move/`): según permisos del portafolio. No hay DELETE.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este entidad.
        required: true
      tags:
      - entities
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entidad'
          description: ''
    patch:
      operationId: entities_partial_update
      description: |-
        Entidades. Cada persona ve solo las suyas; el Admin y el superusuario ven todas.

        - Cada entidad pertenece a un portafolio (D-29). Se ven las propias (membresía) y las de los
          portafolios donde se tiene permiso de verlas; el Admin ve todas.
        - Crear: Admin, Moderador (en su portafolio personal si no elige otro) o quien tenga
          `create_portfolio_entities` en el portafolio elegido.
        - Editar nombre y descripción: quien tenga `edit_portfolio_entities` en el portafolio o
          `entities.edit_entity` en ella.
        - Archivar o reactivar (`estado`) y mover (`/move/`): según permisos del portafolio. No hay DELETE.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este entidad.
        required: true
      tags:
      - entities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEntidadRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entidad'
          description: ''
  /api/entities/{id}/move/:
    post:
      operationId: entities_move_create
      description: |-
        Cambia la entidad de portafolio: hace falta poder moverla en el origen y crear
        entidades en el destino (el Admin puede con cualquiera).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este entidad.
        required: true
      tags:
      - entities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoverEntidadRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entidad'
          description: ''
  /api/entity-types/:
    get:
      operationId: entity_types_list
      description: |-
        Tipos de entidad (Proyecto, Sucursal…). Ver: Admin o miembros. Escribir: solo el Admin.

        Un tipo que ya tiene entidades no se puede eliminar (se puede desactivar con `activo`).
      tags:
      - entity-types
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TipoEntidad'
          description: ''
    post:
      operationId: entity_types_create
      description: |-
        Tipos de entidad (Proyecto, Sucursal…). Ver: Admin o miembros. Escribir: solo el Admin.

        Un tipo que ya tiene entidades no se puede eliminar (se puede desactivar con `activo`).
      tags:
      - entity-types
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TipoEntidadRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TipoEntidad'
          description: ''
  /api/entity-types/{id}/:
    get:
      operationId: entity_types_retrieve
      description: |-
        Tipos de entidad (Proyecto, Sucursal…). Ver: Admin o miembros. Escribir: solo el Admin.

        Un tipo que ya tiene entidades no se puede eliminar (se puede desactivar con `activo`).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este tipo de entidad.
        required: true
      tags:
      - entity-types
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TipoEntidad'
          description: ''
    patch:
      operationId: entity_types_partial_update
      description: |-
        Tipos de entidad (Proyecto, Sucursal…). Ver: Admin o miembros. Escribir: solo el Admin.

        Un tipo que ya tiene entidades no se puede eliminar (se puede desactivar con `activo`).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este tipo de entidad.
        required: true
      tags:
      - entity-types
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTipoEntidadRequest'
