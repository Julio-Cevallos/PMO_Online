openapi: 3.0.3
info:
  title: PMO Online API
  version: 0.1.0
  description: API de gestión de proyectos
paths:
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: |-
        Cierra sesión: el refresh token queda en lista negra.

        Es público porque la validez la da el propio refresh token; así se puede
        cerrar sesión aunque el access token ya haya expirado.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Perfil del usuario autenticado (GET, PUT, PATCH).
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: auth_me_update
      description: Perfil del usuario autenticado (GET, PUT, PATCH).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: auth_me_partial_update
      description: Perfil del usuario autenticado (GET, PUT, PATCH).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/password/change/:
    post:
      operationId: auth_password_change_create
      description: Cambia la contraseña del usuario autenticado.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: Registro público de usuarios.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/auth/token/:
    post:
      operationId: auth_token_create
      description: Inicio de sesión (access + refresh). 401 credenciales inválidas,
        423 cuenta bloqueada.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
        '401':
          description: Credenciales inválidas
        '423':
          description: Cuenta bloqueada por intentos fallidos
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/entities/:
    get:
      operationId: entities_list
      description: |-
        Entidades. Cada persona ve solo las suyas; el Admin y el superusuario ven todas.

        - Crear: solo el Admin (`entities.manage_entities`).
        - Editar nombre y descripción: Admin o quien tenga `entities.edit_entity` en esa entidad.
        - Archivar o reactivar (`estado`): solo el Admin. No hay DELETE.
      parameters:
      - in: query
        name: estado
        schema:
          type: string
          enum:
          - activa
          - archivada
        description: |-
          * `activa` - Activa
          * `archivada` - Archivada
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - in: query
        name: tipo
        schema:
          type: integer
      tags:
      - entities
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEntidadList'
          description: ''
    post:
      operationId: entities_create
      description: |-
        Entidades. Cada persona ve solo las suyas; el Admin y el superusuario ven todas.

        - Crear: solo el Admin (`entities.manage_entities`).
        - Editar nombre y descripción: Admin o quien tenga `entities.edit_entity` en esa entidad.
        - Archivar o reactivar (`estado`): solo el Admin. No hay DELETE.
      tags:
      - entities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntidadRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entidad'
          description: ''
  /api/entities/{entidad_id}/members/:
    get:
      operationId: entities_members_list
      description: |-
        Miembros de una entidad.

        - GET: Admin o quien tenga `entities.view_members`. Por defecto solo los activos
          (`?activa=false` los inactivos, `?activa=todas` todos).
        - POST: crea la cuenta de una persona nueva o suma una existente, con un rol de nivel menor
          al propio (D-18). Si la persona ya fue miembro y está inactiva, se reactiva.
      parameters:
      - in: path
        name: entidad_id
        schema:
          type: integer
        required: true
      tags:
      - entities
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Miembro'
          description: ''
    post:
      operationId: entities_members_create
      description: |-
        Miembros de una entidad.

        - GET: Admin o quien tenga `entities.view_members`. Por defecto solo los activos
          (`?activa=false` los inactivos, `?activa=todas` todos).
        - POST: crea la cuenta de una persona nueva o suma una existente, con un rol de nivel menor
          al propio (D-18). Si la persona ya fue miembro y está inactiva, se reactiva.
      parameters:
      - in: path
        name: entidad_id
        schema:
          type: integer
        required: true
      tags:
      - entities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MiembroRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Miembro'
          description: ''
  /api/entities/{entidad_id}/members/{id}/:
    get:
      operationId: entities_members_retrieve
      description: |-
        Un miembro: ver, cambiar su rol o activarlo y desactivarlo (DELETE desactiva).

        Hace falta un nivel mayor al del rol actual del miembro y, si se cambia el rol, al del nuevo.
        Nadie modifica su propia membresía (salvo el Admin).
      parameters:
      - in: path
        name: entidad_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - entities
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Miembro'
          description: ''
    patch:
      operationId: entities_members_partial_update
      description: |-
        Un miembro: ver, cambiar su rol o activarlo y desactivarlo (DELETE desactiva).

        Hace falta un nivel mayor al del rol actual del miembro y, si se cambia el rol, al del nuevo.
        Nadie modifica su propia membresía (salvo el Admin).
      parameters:
      - in: path
        name: entidad_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - entities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMiembroEditarRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Miembro'
          description: ''
    delete:
      operationId: entities_members_destroy
      description: |-
        Un miembro: ver, cambiar su rol o activarlo y desactivarlo (DELETE desactiva).

        Hace falta un nivel mayor al del rol actual del miembro y, si se cambia el rol, al del nuevo.
        Nadie modifica su propia membresía (salvo el Admin).
      parameters:
      - in: path
        name: entidad_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - entities
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/entities/{id}/:
    get:
      operationId: entities_retrieve
      description: |-
        Entidades. Cada persona ve solo las suyas; el Admin y el superusuario ven todas.

        - Crear: solo el Admin (`entities.manage_entities`).
        - Editar nombre y descripción: Admin o quien tenga `entities.edit_entity` en esa entidad.
        - Archivar o reactivar (`estado`): solo el Admin. No hay DELETE.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este entidad.
        required: true
      tags:
      - entities
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entidad'
          description: ''
    patch:
      operationId: entities_partial_update
      description: |-
        Entidades. Cada persona ve solo las suyas; el Admin y el superusuario ven todas.

        - Crear: solo el Admin (`entities.manage_entities`).
        - Editar nombre y descripción: Admin o quien tenga `entities.edit_entity` en esa entidad.
        - Archivar o reactivar (`estado`): solo el Admin. No hay DELETE.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este entidad.
        required: true
      tags:
      - entities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEntidadRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entidad'
          description: ''
  /api/entity-types/:
    get:
      operationId: entity_types_list
      description: |-
        Tipos de entidad (Proyecto, Sucursal…). Ver: Admin o miembros. Escribir: solo el Admin.

        Un tipo que ya tiene entidades no se puede eliminar (se puede desactivar con `activo`).
      tags:
      - entity-types
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TipoEntidad'
          description: ''
    post:
      operationId: entity_types_create
      description: |-
        Tipos de entidad (Proyecto, Sucursal…). Ver: Admin o miembros. Escribir: solo el Admin.

        Un tipo que ya tiene entidades no se puede eliminar (se puede desactivar con `activo`).
      tags:
      - entity-types
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TipoEntidadRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TipoEntidad'
          description: ''
  /api/entity-types/{id}/:
    get:
      operationId: entity_types_retrieve
      description: |-
        Tipos de entidad (Proyecto, Sucursal…). Ver: Admin o miembros. Escribir: solo el Admin.

        Un tipo que ya tiene entidades no se puede eliminar (se puede desactivar con `activo`).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este tipo de entidad.
        required: true
      tags:
      - entity-types
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TipoEntidad'
          description: ''
    patch:
      operationId: entity_types_partial_update
      description: |-
        Tipos de entidad (Proyecto, Sucursal…). Ver: Admin o miembros. Escribir: solo el Admin.

        Un tipo que ya tiene entidades no se puede eliminar (se puede desactivar con `activo`).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este tipo de entidad.
        required: true
      tags:
      - entity-types
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTipoEntidadRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TipoEntidad'
          description: ''
    delete:
      operationId: entity_types_destroy
      description: |-
        Tipos de entidad (Proyecto, Sucursal…). Ver: Admin o miembros. Escribir: solo el Admin.

        Un tipo que ya tiene entidades no se puede eliminar (se puede desactivar con `activo`).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este tipo de entidad.
        required: true
      tags:
      - entity-types
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/permissions/:
    get:
      operationId: permissions_list
      description: Permisos que se pueden asignar a roles, con su ámbito (`global`
        o `entidad`).
      tags:
      - permissions
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PermisoCatalogo'
          description: ''
  /api/roles/:
    get:
      operationId: roles_list
      description: |-
        Gestión de roles y de sus permisos (solo con `accounts.manage_roles`, es decir, el Admin).

        - `Admin` es del sistema y global: no se edita ni se borra.
        - `Planificador`, `Operario de campo` y `Auditor` son del sistema: se editan sus permisos,
          pero no se renombran ni se borran.
        - Los roles que se creen son siempre por entidad y solo reciben permisos por entidad del
          catálogo (`/api/permissions/`); un permiso global nunca se asigna (D-16).
      tags:
      - roles
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
          description: ''
    post:
      operationId: roles_create
      description: |-
        Gestión de roles y de sus permisos (solo con `accounts.manage_roles`, es decir, el Admin).

        - `Admin` es del sistema y global: no se edita ni se borra.
        - `Planificador`, `Operario de campo` y `Auditor` son del sistema: se editan sus permisos,
          pero no se renombran ni se borran.
        - Los roles que se creen son siempre por entidad y solo reciben permisos por entidad del
          catálogo (`/api/permissions/`); un permiso global nunca se asigna (D-16).
      tags:
      - roles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
          description: ''
  /api/roles/{id}/:
    get:
      operationId: roles_retrieve
      description: |-
        Gestión de roles y de sus permisos (solo con `accounts.manage_roles`, es decir, el Admin).

        - `Admin` es del sistema y global: no se edita ni se borra.
        - `Planificador`, `Operario de campo` y `Auditor` son del sistema: se editan sus permisos,
          pero no se renombran ni se borran.
        - Los roles que se creen son siempre por entidad y solo reciben permisos por entidad del
          catálogo (`/api/permissions/`); un permiso global nunca se asigna (D-16).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este grupo.
        required: true
      tags:
      - roles
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
          description: ''
    patch:
      operationId: roles_partial_update
      description: |-
        Gestión de roles y de sus permisos (solo con `accounts.manage_roles`, es decir, el Admin).

        - `Admin` es del sistema y global: no se edita ni se borra.
        - `Planificador`, `Operario de campo` y `Auditor` son del sistema: se editan sus permisos,
          pero no se renombran ni se borran.
        - Los roles que se creen son siempre por entidad y solo reciben permisos por entidad del
          catálogo (`/api/permissions/`); un permiso global nunca se asigna (D-16).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este grupo.
        required: true
      tags:
      - roles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRoleRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
          description: ''
    delete:
      operationId: roles_destroy
      description: |-
        Gestión de roles y de sus permisos (solo con `accounts.manage_roles`, es decir, el Admin).

        - `Admin` es del sistema y global: no se edita ni se borra.
        - `Planificador`, `Operario de campo` y `Auditor` son del sistema: se editan sus permisos,
          pero no se renombran ni se borran.
        - Los roles que se creen son siempre por entidad y solo reciben permisos por entidad del
          catálogo (`/api/permissions/`); un permiso global nunca se asigna (D-16).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este grupo.
        required: true
      tags:
      - roles
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/users/:
    get:
      operationId: users_list
      description: |-
        Gestión de usuarios (solo con el permiso `accounts.manage_users`, es decir, el rol Admin).

        No hay DELETE: las cuentas se desactivan (`is_active`) para conservar la trazabilidad.
        Los superusuarios no aparecen para el Admin (D-16).
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserAdminList'
          description: ''
    post:
      operationId: users_create
      description: |-
        Gestión de usuarios (solo con el permiso `accounts.manage_users`, es decir, el rol Admin).

        No hay DELETE: las cuentas se desactivan (`is_active`) para conservar la trazabilidad.
        Los superusuarios no aparecen para el Admin (D-16).
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAdminRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAdmin'
          description: ''
  /api/users/{id}/:
    get:
      operationId: users_retrieve
      description: |-
        Gestión de usuarios (solo con el permiso `accounts.manage_users`, es decir, el rol Admin).

        No hay DELETE: las cuentas se desactivan (`is_active`) para conservar la trazabilidad.
        Los superusuarios no aparecen para el Admin (D-16).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este usuario.
        required: true
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAdmin'
          description: ''
    patch:
      operationId: users_partial_update
      description: |-
        Gestión de usuarios (solo con el permiso `accounts.manage_users`, es decir, el rol Admin).

        No hay DELETE: las cuentas se desactivan (`is_active`) para conservar la trazabilidad.
        Los superusuarios no aparecen para el Admin (D-16).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este usuario.
        required: true
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserAdminRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAdmin'
          description: ''
  /api/users/{id}/unlock/:
    post:
      operationId: users_unlock_create
