components:
  schemas:
    AmbitoEnum:
      enum:
      - entidad
      - portafolio
      type: string
      description: |-
        * `entidad` - entidad
        * `portafolio` - portafolio
    Candidato:
      type: object
      description: Una cuenta que se puede sumar a la entidad (resultado de la búsqueda).
      properties:
        id:
          type: integer
        username:
          type: string
        first_name:
          type: string
        last_name:
          type: string
      required:
      - first_name
      - id
      - last_name
      - username
    CategoriaEnum:
      enum:
      - sistema
      - entidad
      - contenido
      type: string
      description: |-
        * `sistema` - Sistema
        * `entidad` - Entidad
        * `contenido` - Contenido
    ChangePasswordRequest:
      type: object
      properties:
        old_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - new_password
      - old_password
    Entidad:
      type: object
